global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules cargadas desde archivo separado.
rule_files:
  - /etc/prometheus/prometheus-rules.yml

# Targets actualizados post ADR-0014 (2026-05-27): 2 servicios backend
# (flit-gateway YARP + flit-api .NET) + python-ml + minio.
scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'flit-gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['core-api-gateway:8080']
        labels:
          service: flit-gateway

  - job_name: 'core-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['core-api:8081']
        labels:
          service: core-api

  - job_name: 'python-ml'
    metrics_path: /metrics
    static_configs:
      - targets: ['python-ml:8000']
        labels:
          service: python-ml

  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: minio
