<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>FLIT — Equipo de Desarrollo</title>
    <script>
      (function () {
        var key = "flit-theme";
        var stored = localStorage.getItem(key);
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = stored === "dark" || (stored !== "light" && prefersDark);
        if (isDark) document.documentElement.classList.add("dark");
        var styleKey = "flit-home-style";
        var styleStored = localStorage.getItem(styleKey);
        var validStyles = ["classic", "corporate", "high-contrast"];
        var homeStyle =
          styleStored && validStyles.indexOf(styleStored) >= 0 ? styleStored : "classic";
        document.documentElement.dataset.homeStyle = homeStyle;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
