server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # NOTA: el SPA llama directamente a la API publica (gateway) usando la URL
    # absoluta inyectada en build (VITE_API_BASE_URL=https://api.orca.flitsas.com/api/v1),
    # por eso aqui NO se hace proxy de /api. El reverse-proxy del host enruta:
    #   orca.flitsas.com      -> este contenedor (frontend :4001)
    #   api.orca.flitsas.com  -> gateway  (:4002)
    #   core.orca.flitsas.com -> Flit.Api (:4003)

    # SPA fallback: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
