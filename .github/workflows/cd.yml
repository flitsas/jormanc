name: CD - Build & Deploy to VPS

on:
  push:
    branches: [release, develop]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Requerido por cache-to: type=gha (export/import BuildKit cache)
  actions: write

env:
  REGISTRY: ghcr.io
  # Namespace del paquete GHCR segun la rama (Opcion A: paquetes separados por ambiente):
  #   release -> jormanc-pdn   |   develop -> jormanc-dev
  CORE_API_IMAGE: ghcr.io/flitsas/${{ github.ref == 'refs/heads/release' && 'jormanc-pdn' || 'jormanc-dev' }}/core-api
  FRONTEND_IMAGE: ghcr.io/flitsas/${{ github.ref == 'refs/heads/release' && 'jormanc-pdn' || 'jormanc-dev' }}/frontend

jobs:
  build-core-api:
    name: Build & push core-api (.NET) image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata — core-api
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CORE_API_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push core-api
        uses: docker/build-push-action@v6
        with:
          context: ./services/core-api
          file: ./services/core-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=core-api
          cache-to: type=gha,mode=max,scope=core-api,ignore-error=true

  build-frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata — frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=https://${{ github.ref == 'refs/heads/release' && 'api.jormanc.flitsas.online' || 'dev.api.jormanc.flitsas.online' }}/api/v1
            VITE_TRASPASOS_API_BASE_URL=https://${{ github.ref == 'refs/heads/release' && 'api.jormanc.flitsas.online' || 'dev.api.jormanc.flitsas.online' }}/api/v1/procedures
            VITE_DEV_USER_ID=01900000-100b-7001-8001-000000000001
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend,ignore-error=true

  deploy-to-vps:
    name: Deploy to VPS
    needs: [build-core-api, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.ref == 'refs/heads/release' && 'production' || 'develop' }}
      url: ${{ vars.PUBLIC_DOMAIN && format('https://{0}', vars.PUBLIC_DOMAIN) || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to VPS
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # Falla rapido y nombra el secret faltante (en vez de un exit 1 opaco)
          : "${SSH_HOST:?Falta el secret HOSTINGER_SSH_HOST}"
          : "${SSH_USER:?Falta el secret HOSTINGER_SSH_USER}"
          : "${DEPLOY_PATH:?Falta el secret HOSTINGER_DEPLOY_PATH}"
          [ -n "$SSH_KEY" ] || { echo "Falta el secret HOSTINGER_SSH_KEY"; exit 1; }

          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Best-effort: precarga la host key. Si ssh-keyscan falla (es intermitente),
          # StrictHostKeyChecking=accept-new la aceptara en la primera conexion igual.
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i /tmp/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i /tmp/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            docker-compose.prod.yml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.prod.yml"
          rm -f /tmp/deploy_key

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd "${{ secrets.HOSTINGER_DEPLOY_PATH }}"

            # Authenticate to GHCR on the VPS to pull private images
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Legacy compose project (flit-dev) — libera puertos 40xxx si quedó huérfano
            # tras renombrar COMPOSE_PROJECT_NAME. No-op si el proyecto no existe.
            docker compose -p flit-dev -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true

            # Bajar el stack actual antes de pull/up evita "port is already allocated"
            # cuando recreate no libera el bind del contenedor anterior a tiempo.
            docker compose -f docker-compose.prod.yml down --remove-orphans || true

            # VPS DEV: activar seed demo sin cambiar ASPNETCORE_ENVIRONMENT a Development
            if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
              export FLIT_SEED_DEMO_DATA=true
            fi

            docker compose -f docker-compose.prod.yml pull
            if ! docker compose -f docker-compose.prod.yml up -d; then
              echo "docker compose up FAILED — diagnostics:"
              ss -tlnp 2>/dev/null | grep -E '40106|40206|40306|60106|60206|60306' || true
              docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
              exit 1
            fi

            # Remove dangling images to free space
            docker image prune -f

            # Health check: hit the container directly (bypass host nginx).
            # Lee puertos del .env; fallback segun rama (develop 40xxx / release 60xxx).
            FE_PORT="$(grep -E '^FRONTEND_PORT=' .env 2>/dev/null | head -1 | cut -d= -f2 || true)"
            GW_PORT="$(grep -E '^GATEWAY_PORT=' .env 2>/dev/null | head -1 | cut -d= -f2 || true)"
            FE_PORT="${FE_PORT:-${{ github.ref == 'refs/heads/release' && '60106' || '40106' }}}"
            GW_PORT="${GW_PORT:-${{ github.ref == 'refs/heads/release' && '60206' || '40206' }}}"
            echo "Waiting for application to start (front:$FE_PORT gateway:$GW_PORT)..."
            sleep 15
            ok=0
            for i in 1 2 3 4 5 6; do
              # Front + API publica del gateway deben responder.
              if curl -fsS "http://127.0.0.1:${FE_PORT}/" > /dev/null \
                 && curl -fsS "http://127.0.0.1:${GW_PORT}/health" > /dev/null; then
                echo "Health check OK (attempt $i)"
                ok=1
                break
              fi
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "Health check FAILED"
              ss -tlnp 2>/dev/null | grep -E '40106|40206|40306|60106|60206|60306' || true
              docker compose -f docker-compose.prod.yml ps
              docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
              docker compose -f docker-compose.prod.yml logs --tail=100
              exit 1
            fi
            echo "Deploy OK."

      - name: Notify success
        if: success()
        run: echo "Deploy to production succeeded."

      - name: Notify failure
        if: failure()
        run: |
          echo "Deploy FAILED. Check logs above."
          echo "Manual rollback: ssh into VPS and run:"
          echo "  cd <deploy-path> && docker compose down && docker compose up -d"
